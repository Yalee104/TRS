<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TRS — 2D Fighting Demo (Phaser 3 + Yuka)</title>
    <style>
      /* The page chrome is plain HTML/CSS. The GAME itself lives entirely
         inside a <canvas> that Phaser creates and injects into #game.
         This is the "rich animation in HTML" boundary: HTML/CSS for the
         surrounding UI, canvas for the high-frequency animated content. */
      html, body {
        margin: 0;
        background: #14151a;
        color: #e6e6e6;
        font-family: system-ui, sans-serif;
        display: flex;
        flex-direction: column;
        align-items: center;
        min-height: 100vh;
      }
      h1 { font-size: 18px; font-weight: 600; margin: 12px 0 4px; }
      .hint { font-size: 13px; color: #9aa0aa; margin-bottom: 10px; }
      .hint b { color: #cdd2da; }
      #game { box-shadow: 0 10px 40px rgba(0,0,0,.5); border-radius: 6px; overflow: hidden; }
      kbd {
        background: #2a2d36; border: 1px solid #3a3e49; border-bottom-width: 2px;
        border-radius: 4px; padding: 1px 6px; font-size: 12px;
      }
    </style>
    <script type="module" crossorigin src="/assets/index-D5J1nF2l.js"></script>
  </head>
  <body>
    <h1>TRS — 2D Arcade Fighting Demo</h1>
    <p class="hint">
      Move <kbd>←</kbd><kbd>→</kbd> &nbsp;•&nbsp; Jump <kbd>↑</kbd> &nbsp;•&nbsp;
      Punch <kbd>A</kbd> &nbsp;•&nbsp; Kick <kbd>S</kbd> &nbsp;•&nbsp; Block <kbd>D</kbd>
      &nbsp;•&nbsp; Toggle hitboxes <kbd>H</kbd> &nbsp;•&nbsp; Reset <kbd>R</kbd>
      <br />Opponent is driven by a <b>Yuka</b> state machine.
    </p>
    <!-- Phaser mounts its canvas here (see src/main.js -> config.parent) -->
    <div id="game"></div>

    <!-- type="module" lets us use ES import/export. Vite bundles this. -->
  </body>
</html>
