<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Hack & Blast — SHMUP demo</title>
    <style>
      :root { color-scheme: dark; }
      * { box-sizing: border-box; }
      /* Fill the viewport exactly so the whole game is visible without scrolling. */
      body { margin: 0; height: 100vh; overflow: hidden; background: #07080c; color: #e6e6e6;
        font-family: system-ui, sans-serif; display: flex; flex-direction: column; align-items: center; }
      a.back { position: fixed; top: 10px; left: 14px; color: #8a90a0; font-size: 13px; text-decoration: none; }
      h1 { font-size: 16px; margin: 8px 0 2px; }
      .hint { font-size: 12px; color: #9aa0aa; margin: 0 0 8px; text-align: center; padding: 0 10px; }
      .hint kbd { background: #2a2d36; border: 1px solid #3a3e49; border-radius: 4px; padding: 0 5px; }

      /* Game on the left, puzzle panel on the right — laid out in a row so the
         puzzle never overlaps the game. The panel is empty/hidden until launched. */
      .arena { display: flex; flex-direction: row; align-items: center; justify-content: center; gap: 18px; }

      /* The canvas backing store stays 480×720; this just scales the on-screen size.
         Width is the single driver (smallest of the design width, the viewport width,
         and the width that keeps the 2:3 box within the leftover viewport height), so
         aspect-ratio derives the height and the stage can never overflow the screen. */
      .stage { position: relative; aspect-ratio: 480 / 720; flex: none;
        width: min(480px, 50vw, calc((100vh - 96px) * 2 / 3));
        border-radius: 8px; overflow: hidden; box-shadow: 0 10px 40px rgba(0,0,0,.5); }
      #game { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }

      /* HUD overlay */
      .hud { position: absolute; inset: 0; pointer-events: none; }
      .hud .bar { pointer-events: none; }
      .hpbar { position: absolute; height: 12px; background: rgba(0,0,0,.45); border: 1px solid rgba(255,255,255,.25); border-radius: 6px; overflow: hidden; }
      #hp-boss-wrap { top: 10px; left: 40px; right: 40px; }
      #hp-boss-fill { height: 100%; width: 100%; background: linear-gradient(90deg,#ff6a6a,#ff3b3b); }
      /* enemy shield wall (5x HP) shown as a thin bar above the boss HP bar */
      #hp-boss-shield { top: 25px; left: 40px; right: 40px; height: 5px; }
      #hp-boss-shield-fill { height: 100%; width: 100%; background: linear-gradient(90deg,#5fb0ff,#9fd4ff); transition: background .2s; }
      #hp-boss-shield.down #hp-boss-shield-fill { background: repeating-linear-gradient(90deg,#ffae46 0 6px,transparent 6px 12px); }
      #hp-player-wrap { bottom: 8px; left: 40px; right: 40px; }
      #hp-player-fill { height: 100%; width: 100%; background: linear-gradient(90deg,#3ad36a,#5ef08a); }
      #hp-shield-fill { position: absolute; inset: 0; height: 100%; width: 0%; background: rgba(120,170,255,.7); }

      #status-row { position: absolute; bottom: 72px; left: 40px; display: flex; gap: 6px; }
      .chip { font-size: 11px; background: rgba(20,24,34,.85); border: 1px solid #2a2e3a; border-radius: 999px; padding: 1px 7px; }

      .hackbtn { pointer-events: auto; position: absolute; left: 50%; transform: translateX(-50%);
        width: 130px; height: 40px; border-radius: 9px; border: 1px solid #3a4d70; background: #223150;
        color: #eaf0ff; font-size: 14px; font-weight: 600; cursor: pointer; overflow: hidden; }
      .hackbtn:hover { background: #2b3a5e; }
      .hackbtn.disabled { opacity: .55; cursor: not-allowed; }
      #hack { top: 30px; background: #4a2350; border-color: #743a70; }
      /* sits in the reserved bottom strip, clear of the (raised) player ship */
      #protect { bottom: 26px; background: #1f4a3a; border-color: #2e7a5a; }
      .cd-fill { position: absolute; left: 0; bottom: 0; width: 100%; height: 0%; background: rgba(0,0,0,.55); pointer-events: none; }
      .cd-label { position: relative; z-index: 1; }

      #banner-wrap { position: absolute; inset: 0; display: none; align-items: center; justify-content: center;
        flex-direction: column; gap: 16px; background: rgba(5,7,12,.6); pointer-events: auto; }
      #banner { font-size: 44px; font-weight: 800; }
      #banner.win { color: #5ef08a; } #banner.lose { color: #ff6a6a; }
      #restart { pointer-events: auto; padding: 10px 18px; border-radius: 9px; border: 1px solid #3a4d70;
        background: #2b3a55; color: #eaf0ff; font-size: 14px; cursor: pointer; }

      /* puzzle panel — sits to the RIGHT of the game (the bridge builds a
         .gpp-panel with a countdown timer + .gpp-host mount inside here). */
      #puzzle-overlay { display: none; align-items: center; justify-content: center; }
      #puzzle-overlay .gpp-panel { width: min(380px, 44vw); background: #0c0f17;
        border: 1px solid #232a3a; border-radius: 12px; padding: 14px;
        box-shadow: 0 10px 40px rgba(0,0,0,.55); }
      #puzzle-overlay .gpp-host { width: 100%; }

      /* big, visible countdown; flashes red under 5s to signal urgency */
      #puzzle-overlay .gpp-timer { text-align: center; font-size: 32px; font-weight: 800;
        font-variant-numeric: tabular-nums; letter-spacing: .02em; color: #cfe0ff; margin-bottom: 10px; }
      #puzzle-overlay .gpp-timer.urgent { color: #ff5050; animation: gpp-timer-flash .5s steps(2, start) infinite; }
      @keyframes gpp-timer-flash { 0%, 100% { opacity: 1; } 50% { opacity: .15; } }

      /* flashing "START" label so the entry point is obvious right away */
      #puzzle-overlay .gpp-start .gpp-label { font-size: calc(24cqi / var(--cols));
        color: #fff; font-weight: 800; letter-spacing: 0; text-shadow: 0 1px 2px rgba(0,0,0,.6);
        animation: gpp-start-flash 1s ease-in-out infinite; }
      @keyframes gpp-start-flash { 0%, 100% { opacity: 1; transform: scale(1); } 50% { opacity: .35; transform: scale(.88); } }
    </style>
  </head>
  <body>
    <a class="back" href="/">← all games</a>
    <h1>✈️ Hack &amp; Blast</h1>
    <p class="hint">Move <kbd>←</kbd><kbd>→</kbd> (auto-fire) · <b>Hack</b> <kbd>J</kbd> = offensive ·
      <b>Protect</b> <kbd>K</kbd> = defensive</p>

    <div class="arena">
      <div class="stage">
        <canvas id="game"></canvas>
        <div class="hud">
          <div id="hp-boss-wrap" class="hpbar"><div id="hp-boss-fill"></div></div>
          <div id="hp-boss-shield" class="hpbar"><div id="hp-boss-shield-fill"></div></div>
          <button id="hack" class="hackbtn"><div id="hack-cd" class="cd-fill"></div><span class="cd-label"></span> 🔓 Hack</button>
          <button id="protect" class="hackbtn"><div id="protect-cd" class="cd-fill"></div><span class="cd-label"></span> 🛡️ Protect</button>
          <div id="status-row"></div>
          <div id="hp-player-wrap" class="hpbar"><div id="hp-player-fill"></div><div id="hp-shield-fill"></div></div>
          <div id="banner-wrap"><div id="banner"></div><button id="restart">Restart</button></div>
        </div>
      </div>
      <div id="puzzle-overlay"></div>
    </div>

    <script type="module" src="./main.js"></script>
  </body>
</html>
